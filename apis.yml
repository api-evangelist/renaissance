- name: Lexile API
  description: >-
    Lexile measure lookup by ISBN-13, returning the stored Lexile book record. OpenAPI 3.0.1 published
    at the API host root; the API gateway validates a JWT issued by Renaissance auth (client credentials)
    and enforces the ren.lexile.read scope.
