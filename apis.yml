apis:
  - name: Student Proficiency Service
    description: >-
      Renaissance-operated prediction service returning student proficiency on math skills and skill groups,
      the next recommended pathway activity for a student, a student's current reading level, and class
      roster lookups. OpenAPI 3.1.0 published at the service root; every scored operation requires an HTTP
      bearer JWT. Student identifiers are Renaissance Growth Platform ids (student_rgp_id).
    humanURL: https://proficiency.renaissance.com/docs
    baseURL: https://proficiency.renaissance.com
    tags:
      - Education
      - Assessment
      - Learning Analytics
      - Machine Learning
      - Student Data
    tags_raw:
      - education
      - assessment
      - learning-analytics
      - machine-learning
      - student-data
    properties:
      - type: OpenAPI
        url: openapi/renaissance-student-proficiency-service-openapi.yml
      - type: APIReference
        url: https://proficiency.renaissance.com/docs
      - type: Overlay
        url: overlays/renaissance-student-proficiency-service-overlay.yaml
      - type: ErrorCatalog
        url: errors/renaissance-problem-types.yml
      - type: DataModel
        url: data-model/renaissance-data-model.yml
  - name: Student Pathway Event Proxy
    description: >-
      Event ingestion proxy that accepts Freckle practice events (assignment, activity and answer payloads)
      into the Renaissance student pathway pipeline. OpenAPI 3.1.0 published at the service root; the single
      POST /freckle-events operation is bearer-token gated and answers 202 on accept.
    humanURL: https://events.proficiency.renaissance.com/docs
    baseURL: https://events.proficiency.renaissance.com
    tags:
      - Education
      - Student Data
      - Learning Analytics
    tags_raw:
      - education
      - student-data
      - learning-analytics
    properties:
      - type: OpenAPI
        url: openapi/renaissance-student-pathway-event-proxy-openapi.yml
      - type: APIReference
        url: https://events.proficiency.renaissance.com/docs
      - type: Overlay
        url: overlays/renaissance-student-pathway-event-proxy-overlay.yaml
  - name: Lexile API
    description: >-
      Lexile measure lookup by ISBN-13, returning the stored Lexile book record. OpenAPI 3.0.1 published at
      the API host root; the API gateway validates a JWT issued by Renaissance auth (client credentials) and
      enforces the ren.lexile.read scope.
    humanURL: https://api.proxile.renaissance.com/swagger
    baseURL: https://api.proxile.renaissance.com
    tags:
      - Education
      - Reading
      - Student Data
    tags_raw:
      - education
      - reading
      - student-data
    properties:
      - type: OpenAPI
        url: openapi/renaissance-lexile-api-openapi.yml
      - type: APIReference
        url: https://api.proxile.renaissance.com/swagger
      - type: OAuthScopes
        url: scopes/renaissance-scopes.yml
      - type: Overlay
        url: overlays/renaissance-lexile-api-overlay.yaml
