aid: renaissance
name: Renaissance
description: >-
  Renaissance Learning, Inc. is a pre-K–12 education technology company whose assessment, practice and
  analytics products — Star Assessments, Accelerated Reader, Freckle, myON, Lalilo, Flocabulary, Nearpod,
  FastBridge, DnA, eduCLIMBER, eSchoolData, SchoolCity and the Renaissance Growth Platform — are used by
  schools in more than 100 countries. Its machine-readable surface is not a published developer program:
  district integration is delivered through 1EdTech OneRoster 1.1 rostering (certified across twelve
  products), LTI 1.3 / LTI Advantage launches (Nearpod, SchoolCity), an Ed-Fi Assessment Outcomes API
  certification for DnA, and a Renaissance-operated OAuth 2.0 / OpenID Connect authorization server at
  auth.renaissance.com. Three first-party OpenAPI contracts are served publicly but token-gated on
  Renaissance-controlled hosts: the Student Proficiency Service, the Student Pathway Event Proxy and the
  Lexile API.
