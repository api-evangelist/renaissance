note: >-
  Renaissance's interoperability posture is almost entirely domain-standard rather than generic REST
  convention. The 1EdTech certification register lists 14 certified Renaissance products, the Ed-Fi
  Alliance lists a current Assessment Outcomes API credential for DnA, and the trust center names the
  security/compliance programs. Everything below is recorded against the page that states it.
conformance:
  - id: oauth2
    conforms: true
    evidence: https://auth.renaissance.com/.well-known/openid-configuration
    detail: >-
      Renaissance operates its own OAuth 2.0 authorization server (issuer https://auth.renaissance.com).
      grant_types_supported includes authorization_code, client_credentials, refresh_token and the
      RFC 8628 device code grant.
  - id: oidc
    conforms: true
    evidence: https://auth.renaissance.com/.well-known/openid-configuration
    detail: >-
      OpenID Provider metadata served at the RFC 8414 / OIDC Discovery path, with a live JWKS,
      userinfo, end_session and backchannel/frontchannel logout endpoints. id_token_signing_alg RS256.
  - id: rfc8414
    conforms: true
    evidence: https://auth.renaissance.com/.well-known/oauth-authorization-server
    detail: The oauth-authorization-server metadata document is served and is byte-identical to the OIDC one.
  - id: rfc7636
    conforms: true
    evidence: https://auth.renaissance.com/.well-known/openid-configuration
    detail: PKCE advertised — code_challenge_methods_supported includes S256.
  - id: rfc8628
    conforms: true
    evidence: https://auth.renaissance.com/.well-known/openid-configuration
    detail: Device authorization grant endpoint published at /oauth2/device/auth.
  - id: rfc9457
    conforms: false
    evidence: openapi/renaissance-student-proficiency-service-openapi.yml
    detail: >-
      No application/problem+json responses in any contract. Errors are FastAPI-shaped
      (HTTPValidationError on 422) or a bespoke NextActivityErrorResponse envelope.
  - id: pagination
    conforms: false
    evidence: openapi/renaissance-student-proficiency-service-openapi.yml
    detail: No collection operation declares page/cursor/limit parameters.
  - id: idempotency
    conforms: false
    evidence: openapi/renaissance-student-proficiency-service-openapi.yml
    detail: No Idempotency-Key header is declared on any of the five mutating operations.
